name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build and check types
        run: npm run build

      - name: Check production SEO
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/ishivox-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/ishivox-next.log"' EXIT
          curl --fail --silent --show-error --output /dev/null \
            --retry 30 --retry-connrefused --retry-delay 1 \
            --max-time 2 --retry-max-time 45 http://localhost:3000
          npm run test:seo
